name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen --only-group dev ruff check
      - run: uv run --frozen --only-group dev ruff format --check src tests qgis

  test:
    runs-on: ubuntu-latest
    container: qgis/qgis:4.2
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: /usr/share/qgis/python
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - uses: actions/checkout@v4
      - run: pip install . pytest
      - name: pytest
        run: python3 -m pytest -m "not network"
      - name: QGIS smoke test
        run: python3 qgis/smoke_test.py

  package:
    runs-on: ubuntu-latest
    container: qgis/qgis:4.2
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: /usr/share/qgis/python
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - uses: actions/checkout@v4
      - name: Build the plugin zip
        run: python3 qgis/build_zip.py dist
      - name: Without its packages, the plugin says what to install
        run: python3 qgis/zip_check.py dist/*.zip missing
      - run: pip install -r qgis/wxforecast_qgis/requirements.txt
      - name: With its packages, the plugin loads the bundled library
        run: python3 qgis/zip_check.py dist/*.zip installed
      - uses: actions/upload-artifact@v4
        with:
          name: wxforecast_qgis
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the plugin zip at the tag's version
        run: python3 qgis/build_zip.py dist "${GITHUB_REF_NAME#v}"
      - name: Publish the GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
